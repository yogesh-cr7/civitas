[project]
name = "civitas"
version = "0.1.0"
description = "A small RAG system over the U.S. founding legal documents, with a real eval suite."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
llm = ["anthropic>=0.30", "python-dotenv>=1.0"]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["civitas"]
